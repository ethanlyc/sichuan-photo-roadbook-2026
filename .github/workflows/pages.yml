name: Publish photography roadbook
on:
  push:
    branches: [main]
    paths: [site.zip]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract reviewed static website
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/hotel-photo-review.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
